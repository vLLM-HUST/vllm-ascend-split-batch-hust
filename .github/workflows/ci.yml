# Package CI.
#
# Moved here from `.github/extension-ci.yml`: GitHub only executes workflows that
# live under `.github/workflows/`, so the template sat dormant (the API reported
# `actions/workflows total_count = 0`). Content is the org template plus:
#   * `-m "not host_tree"` -- the source-level drift guards need the vllm-ascend
#     checkout; they FAIL (not skip) when it is missing, so this dependency-free
#     job deselects them explicitly. The full local run keeps them.
#   * explicit `pip`/flag notes from docs/release.md §8.
name: Extension CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/evidence/**/*.json'
      - 'docs/evidence/**/*.txt'
      - 'docs/evidence/**/*.log'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/evidence/**/*.json'
      - 'docs/evidence/**/*.txt'
      - 'docs/evidence/**/*.log'
  workflow_dispatch:

# The red-leg diagnostic step force-pushes `ci-diag-<python>` branches.  The
# default token is read-only, so that push failed (exit 128) on every red leg of
# runs 39436494902/39437446481/39437993180 and masked the leg's own verdict.
permissions:
  contents: write

jobs:
  package:
    strategy:
      # Report every leg: with fail-fast the first red cancels the others and
      # hides whether they would have passed (seen on run #2, py3.14 cancelled).
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@main"
      - run: python -m pip install -e ".[test]" build
      - run: ruff check .
      - run: ruff format --check .
      # Device- and host-dependent tests skip via tests/_device_stack.py; the
      # host-tree guards are deselected here and run on the NPU host instead.
      - run: pytest -q -m "not host_tree" --junitxml=pytest-results-${{ matrix.python }}.xml
      # Red-leg visibility without artifact download auth: surface each junit
      # failure/error as a check annotation (annotations are public on public
      # repos, artifact downloads are not). Capped at 10 by GitHub.
      - name: surface pytest failures as annotations
        if: failure()
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          found = False
          for f in sorted(glob.glob("pytest-results-*.xml")):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(tc):
                      if bad.tag in ("failure", "error"):
                          found = True
                          name = f"{tc.get('classname')}::{tc.get('name')}"
                          msg = (bad.get("message") or "").splitlines()[0][:160]
                          print(f"::error title={name}::{msg}")
          if not found:
              print("::error::pytest failed but junit reports no failure/error entries")
          PY
      - name: upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python }}
          path: pytest-results-${{ matrix.python }}.xml
          if-no-files-found: ignore
      - name: push pytest diagnostics branch
        if: failure() && github.event_name == 'push'
        run: |
          set -eu
          git config user.email "ci-bot@vllm-hust.invalid"
          git config user.name "ci-bot"
          git checkout -q --orphan "ci-diag-${{ matrix.python }}"
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'pytest-results-*' -exec rm -rf {} +
          git add -f pytest-results-*.xml 2>/dev/null || true
          if git diff --cached --quiet; then echo "no junit to publish"; exit 0; fi
          git commit -qm "ci diag for ${{ github.sha }}"
          git push -q origin +HEAD:refs/heads/ci-diag-${{ matrix.python }}
      - run: python -m build
      - run: python tools/check_distribution.py dist
      - run: vllm-hust-ext extension inspect org.vllm-hust.split-batch-full-graph
