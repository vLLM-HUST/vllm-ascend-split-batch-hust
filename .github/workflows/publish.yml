# Publish to TestPyPI / PyPI with a Trusted Publisher (OIDC) -- no long-lived
# token in the repo, no token in the command history.
#
# Why OIDC instead of an API token: PyPI matches a short-lived OIDC token minted
# by GitHub Actions against the publisher configured on the PyPI side; nothing
# secret is stored here. PyPI-side setup steps: docs/release.md §11.2-11.4.
#
# Two triggers, both OIDC-only:
#
#   * `workflow_dispatch` (safe by default): target defaults to TestPyPI, so a
#     stray dispatch cannot touch the real index. Publishing for real requires
#     picking `pypi`. This is the path used for 0.1.0-0.1.2.
#   * `push` of a `v*` tag: publishes to PyPI (a release tag is an explicit
#     release act). Added 2026-09-27 because dispatching the job needs GitHub
#     API credentials, and a maintainer without them can still release by
#     pushing a tag over SSH. Guarded by a tag/version equality check below, so
#     a stale or mistyped tag fails BEFORE the upload step.
#
# The PyPI trusted publisher is registered for this exact file
# (`.github/workflows/publish.yml`) and the environment `pypi`; both triggers
# satisfy that (verified PyPI-side semantics: docs/release.md §11.4).
name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to upload to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment name registered in the PyPI trusted publisher
    # (lowercased by PyPI): `pypi` on pypi.org, `testpypi` on test.pypi.org.
    # A tag push always targets the real index; a dispatch keeps its choice.
    environment: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      # vllm-hust-ext has no PyPI release yet (the org installs it from source;
      # see vllm-hust-website plugins.html), and the `test` extra pins ==0.2.0.dev0,
      # so install the git version first or `.[test]` cannot resolve. Same order
      # as .github/workflows/ci.yml.
      - run: python -m pip install "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@main"
      # Gate: the same checks CI runs, so a red tree never reaches the index.
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m "not host_tree"
      # Tag-push guard: the tag must name exactly the version in pyproject.toml.
      # Runs before the build so a mismatched tag cannot reach the index (PyPI
      # files are immutable, so this is the cheap place to be strict).
      - name: Verify the release tag matches the project version (tag pushes)
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, pathlib
          try:
              import tomllib
          except ModuleNotFoundError:  # py<3.11 backstop; runner is 3.12
              import tomli as tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          assert tag == expected, f"tag {tag!r} does not name the project version ({expected!r})"
          print(f"tag {tag} matches pyproject version {version}")
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      # The bundled manifests are the extension's public surface: a wheel
      # without them installs but is undiscoverable, so check before uploading.
      - name: Verify the artifact carries the extension manifests
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          manifests = [n for n in names if n.endswith("vllm-hust-extension-v0.2.json")]
          entries = [n for n in names if n.endswith("entry_points.txt")]
          print(f"{wheel}: {len(manifests)} manifests, {len(entries)} entry_points file(s)")
          if len(manifests) < 4 or not entries:
              sys.exit("wheel is missing manifests or entry points")
          PY
      # Release receipt: which commit and which artifact hashes were uploaded.
      - name: Release receipt
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "ref: $(git describe --tags --always 2>/dev/null || echo "$GITHUB_REF_NAME")"
          echo "version: $(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          sha256sum dist/* | tee dist.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
          path: |
            dist/*
      # Re-running a tag push (e.g. to (re)create the GitHub Release in
      # release.yml) must not fail here: PyPI files are immutable, so an upload
      # of an existing version can only error. Check first and skip -- the
      # Release workflow takes the authoritative bytes from PyPI anyway.
      - name: Check whether this version is already on PyPI
        if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
        id: pypi_state
        run: |
          NAME=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"])')
          VERSION=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$NAME/$VERSION/json")
          echo "pypi.org/pypi/$NAME/$VERSION/json -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME $VERSION is already on PyPI; skipping the upload step"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to TestPyPI
        if: ${{ !(github.event_name == 'push' || inputs.target == 'pypi') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && steps.pypi_state.outputs.already != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
