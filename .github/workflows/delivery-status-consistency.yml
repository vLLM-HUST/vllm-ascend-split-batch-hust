# 交付状态一致性门禁：索引里的结论标签必须被同一算子的 evidence.json 支撑。
#
# 拦的是"标签比证据走得远"：例如 `serving_status: verified_faster` 而
# `serving_end_to_end.tested` 仍是 false、`speedup` 仍是 null。这类写入只看
# 索引看不出来，人为复核容易漏，所以用 `tests/test_delivery_status_consistency.py`
# 做机械判据，并连带检查交付面结构与证据指纹。
#
# 判据本体可本地跑，也可由 `.pre-commit-config.yaml` 的钩子在 `git commit` 时先拦一次。
name: Delivery status consistency

on:
  push:
    paths:
      - 'DELIVERY_INDEX.json'
      - 'ops/**'
      - 'tests/test_delivery_status_consistency.py'
      - 'tests/test_ops_delivery_policy.py'
      - 'tests/test_json_hygiene.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/delivery-status-consistency.yml'
  pull_request:
    paths:
      - 'DELIVERY_INDEX.json'
      - 'ops/**'
      - 'tests/test_delivery_status_consistency.py'
      - 'tests/test_ops_delivery_policy.py'
      - 'tests/test_json_hygiene.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/delivery-status-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-consistency:
    name: Delivery status consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff
      - run: ruff check tests/test_delivery_status_consistency.py
      - run: ruff format --check tests/test_delivery_status_consistency.py
      - run: pytest -q tests/test_delivery_status_consistency.py tests/test_ops_delivery_policy.py tests/test_json_hygiene.py
