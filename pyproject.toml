[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-ascend-split-batch"
version = "0.1.0.dev0"
description = "vllm-ascend-split-batch inert vLLM-HUST contract descriptor"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
# CCE op wheel (fa_fp32_stage1 / lse_merge), Tier-1 fp32 tier; not on PyPI --
# install with --find-links pointing at the kernel repo output/ (see README).
kernels = ["ascend-kernel==2026.3.9"]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext==0.2.0.dev0"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.split-batch-full-graph" = "vllm_ascend_split_batch"

[project.entry-points."vllm.general_plugins"]
"cascade-attention" = "vllm_ascend_split_batch.cascade_plugin:load"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_ascend_split_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
